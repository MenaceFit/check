[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebaywatch"
version = "1.0.0"
description = "Surveillance en temps réel des nouvelles annonces eBay (multi-pays) avec interface terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "selectolax>=0.3.21",
    "textual>=0.86",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ebaywatch = "ebaywatch.cli:main"

[tool.setuptools.packages.find]
include = ["ebaywatch*"]

[tool.setuptools.package-data]
ebaywatch = ["data/*.toml", "tui/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
